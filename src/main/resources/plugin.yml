name: EnsNightMarket
version: 2.1.0
main: dev.ensisdev.ensnightmarket.EnsNightMarket
api-version: '1.20'
folia-supported: true
author: EnsisDev
description: Per-player Night Market with floating heads. Left-click reveal, right-click buy.
softdepend: [Vault, PlayerPoints, PlaceholderAPI, Oraxen, ItemsAdder, Nexo, MMOItems, HeadDatabase, WorldGuard]
commands:
  nightmarket:
    aliases: [ensnightmarket, enm, gecepazari, gece-pazari, night-market]
    description: Gece pazari showcase acar.
    usage: /nightmarket
permissions:
  ensnightmarket.use:
    default: true
  ensnightmarket.admin:
    default: op
  ensnightmarket.reload:
    default: op
  ensnightmarket.showcase:
    default: true
  ensnightmarket.animation:
    default: op
    description: Allows access to animation debug commands
